name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A pull request runs the checks its changes affect; a push to main and a
# manual run run every check, so anything the selection below misses fails
# there. The job always runs and reports, so a docs-only pull request is green
# with its checks skipped rather than left pending.
jobs:
  test:
    name: CI checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The pull request's base commit must be in the clone to diff against.
          fetch-depth: 0

      # frontend: the QML/JS model and the helper launcher/repair scripts.
      # backend:  the Rust helper and the vendored localsend-rs.
      # Documentation, git hooks and ignores select nothing; the CI itself, a
      # path no rule knows, or a failed diff selects everything.
      - name: Select the checks this change affects
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          decide() { # <frontend> <backend> <reason>
            printf 'frontend=%s\nbackend=%s\n' "$1" "$2" >>"$GITHUB_OUTPUT"
            printf 'CI scope: frontend=%s backend=%s -- %s\n' "$1" "$2" "$3" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          [[ $EVENT == pull_request ]] || decide true true "a $EVENT event runs every check"
          changed="$(git diff --name-only "$BASE_SHA" HEAD)" || decide true true "cannot diff against $BASE_SHA"
          frontend=false backend=false
          while IFS= read -r f; do
            [[ -n $f ]] || continue
            case "$f" in
              .github/workflows/*) decide true true "$f: the CI itself changed" ;;
              *.md | plans/* | assets/* | preview.png | LICENSE* | .github/* | .githooks/* | .gitignore) ;;
              backend/* | rust-toolchain.toml | patches/* | about.hbs | about.toml) backend=true ;;
              build.sh) frontend=true backend=true ;;
              *.qml | *.js | qmldir | manifest.json | helper-release.env | bin/* | scripts/* | tests/*) frontend=true ;;
              *) decide true true "$f: no rule knows it" ;;
            esac
          done <<<"$changed"
          decide "$frontend" "$backend" "selected from $(grep -c . <<<"$changed") changed path(s) since ${BASE_SHA:0:12}"

      - name: Install Rust
        if: steps.scope.outputs.backend == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Test frontend model
        if: steps.scope.outputs.frontend == 'true'
        run: node tests/model.test.js && node tests/panel-state.test.js && node tests/service-state.test.js

      - name: Test helper distribution
        if: steps.scope.outputs.frontend == 'true'
        run: bash tests/launcher.test.sh && bash tests/helper-repair.test.sh

      - name: Check Rust formatting
        if: steps.scope.outputs.backend == 'true'
        run: cargo fmt --manifest-path backend/Cargo.toml --all -- --check

      - name: Check Nearby helper builds
        if: steps.scope.outputs.backend == 'true'
        run: cargo check --locked --manifest-path backend/Cargo.toml

      - name: Lint Nearby helper
        if: steps.scope.outputs.backend == 'true'
        run: cargo clippy --all-targets --locked --manifest-path backend/Cargo.toml -- -D warnings

      - name: Test Nearby helper
        if: steps.scope.outputs.backend == 'true'
        run: cargo test --locked --manifest-path backend/Cargo.toml

      - name: Test vendored localsend-rs
        if: steps.scope.outputs.backend == 'true'
        run: cargo test --locked --manifest-path backend/vendor/localsend-rs/Cargo.toml --features https
